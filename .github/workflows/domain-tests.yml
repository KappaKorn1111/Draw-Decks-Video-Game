name: Domain Tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run domain tests
        run: dotnet test tests/DrawDecks.Domain.Tests/DrawDecks.Domain.Tests.csproj --configuration Release
