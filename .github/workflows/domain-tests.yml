name: Build and Test

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore server/DrawDecks.sln
      - name: Build backend and shared domain
        run: dotnet build server/DrawDecks.sln --configuration Release --no-restore
      - name: Run domain tests
        run: dotnet test tests/DrawDecks.Domain.Tests/DrawDecks.Domain.Tests.csproj --configuration Release
